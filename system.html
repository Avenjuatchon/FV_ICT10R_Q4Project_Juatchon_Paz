<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 10 Classmates System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
         body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(to right, #eb7575, #a5fa7d);
        }
        .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #539e31;
        padding: 12px 30px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* LOGO */
        .logo {
        font-weight: bold;
        font-size: 18px;
        color: #f6e22f;
        }

        /* LINKS */
        .nav-links a {
        text-decoration: none;
        color: #ffffff;
        margin-left: 20px;
        font-size: 14px;
        transition: 0.3s;
        }

        /* HOVER EFFECT */
        .nav-links a:hover {
        color: #b92c2c;
        }
</style>
<div class="navbar">
    <div class="logo">10-Ruby</div>

    <div class="nav-links">
        <a href="index.html">Graph</a>
        <a href="system.html">System</a>
        <a href="activities.html">Activities</a>
    </div>
</div>

<body class="bg-light">

<div class="container mt-5">
  <div class="card shadow p-4">
    <h2 class="text-center mb-3">Grade 10 Classmates System</h2>
    <p class="text-center text-muted">whatever the sample output said ok</p>

    <input type="text" id="name" class="form-control mb-2" placeholder="Name">
    <input type="text" id="section" class="form-control mb-2" placeholder="Section">
    <input type="text" id="subject" class="form-control mb-3" placeholder="Favorite Subject">

    <div class="d-flex gap-2">
      <button class="btn btn-primary w-50" onclick="addClassmate()">Add Classmate</button>
      <button class="btn btn-success w-50" onclick="showList()">Show List</button>
    </div>
  </div>

  <div class="card mt-4 p-3">
    <h5>Classmate List</h5>
    <div id="output"></div>
  </div>
</div>
<script>
    // hi mama so like my python hates me and didnt wwanna work so i used script in the html
  class Classmate {
    constructor(name, section, favoriteSubject) {
      this.name = name;
      this.section = section;
      this.favoriteSubject = favoriteSubject;
    }
    // the thingymabob that we will print basiclalyly
    introduce() {
      return `Hi! I am ${this.name} from ${this.section}. My favorite subject is ${this.favoriteSubject}.`;
    }
  }
  // silly list of shibal people /pos /silly 
  let classmates = [
    new Classmate("Trisha", "Ruby", "Social Studies"),
    new Classmate("Sofia", "Ruby", "Mathematics"),
    new Classmate("Denise", "Ruby", "Arts"),
    new Classmate("Hendrich", "Ruby", "Social Studies"),
    new Classmate("Lorr(aka trisha2)", "Ruby", "Social Studies")
  ];

  function addClassmate() {
    const name = document.getElementById("name").value;
    const section = document.getElementById("section").value;
    const subject = document.getElementById("subject").value;

    if (name && section && subject) {
      const newStudent = new Classmate(name, section, subject);
      classmates.push(newStudent);
      alert(name + " added successfully!");

      document.getElementById("name").value = "";
      document.getElementById("section").value = "";
      document.getElementById("subject").value = "";
    } else {
      alert("Please fill in all fields.");
    }
  }

  function showList() {
    const outputDiv = document.getElementById("output");
    outputDiv.innerHTML = "";

    classmates.forEach(student => {
      const p = document.createElement("p");
      p.textContent = student.introduce();
      outputDiv.appendChild(p);
    });
  }
</script>
</body>
</html>
